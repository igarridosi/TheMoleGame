name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest  # Windows behar dugu WPF delako

    env:
      Solution_Name: TheMoleGame.sln
      Test_Project_Path: TestsProject/TestsProject.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # .NET 8 instalatu
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # Dependentziak berreskuratu
    - name: Restore dependencies
      run: dotnet restore
      
    # Konpilatu
    - name: Build
      run: dotnet build --no-restore

    # TESTAK EXEKUTATU (Hemen dago gakoa)
    - name: Run Tests
      run: dotnet test --no-build --verbosity normal